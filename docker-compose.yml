services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fund-network
    ports:
      - "5432:5432"  # 暴露数据库端口，便于本地访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端Flask服务
  backend:
    build: ./backend
    restart: always  # 容器异常自动重启
    volumes:
      # 使用Docker命名卷持久化数据
      - app-data:/app/data
    environment:
      # PostgreSQL数据库配置
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      # JWT密钥配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      # GitHub OAuth配置
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      # SMTP邮件配置
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    networks:
      - fund-network
    ports:
      - "5000:5000"  # 暴露后端API端口，便于本地访问
    dns:
      - 114.114.114.114
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy

  # 前端Nginx服务
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"  # 本地8080端口映射到容器80端口，本地访问http://localhost:8080即可
    depends_on:
      - backend  # 先启动后端再启动前端
    networks:
      - fund-network

  # Cloudflare Tunnel服务
  cloudflared:
    image: cloudflare/cloudflared:2024.12.1
    restart: always
    networks:
      - fund-network
    command: tunnel run --url http://frontend:80 --token ${TUNNEL_TOKEN}

# 自定义网络，保证前后端互通
networks:
  fund-network:
    driver: bridge

# 数据卷：持久化PostgreSQL数据库和应用数据
volumes:
  postgres-data:
    driver: local
  app-data:
    driver: local
