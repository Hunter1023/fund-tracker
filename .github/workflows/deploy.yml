name: Deploy fund-tracker to WSL Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create data directory if not exists
        run: |
          if [ ! -d "data" ]; then
            mkdir -p data
            echo "Created data directory"
          fi

      - name: Create .env file
        run: |
          cat > .env << EOF
          # 基金追踪器 环境配置（自动生成于 $(date '+%Y-%m-%d %H:%M:%S')）

          # 数据库配置
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'fund_user' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'fund_password' }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'fund_tracker' }}

          # JWT 密钥
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}

          # GitHub OAuth 配置
          OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}

          # SMTP 邮件配置
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}

          # 默认公开自选基金代码
          DEFAULT_PUBLIC_FUNDS=020111,020112,020501,016531

          # Cloudflare Tunnel 配置
          TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}
          EOF
          echo "✅ .env file created successfully!"

      - name: Stop existing containers
        run: docker compose down

      - name: Remove old images to force rebuild
        run: |
          docker rmi -f fund-tracker-backend:latest 2>/dev/null || true
          docker rmi -f fund-tracker-frontend:latest 2>/dev/null || true
          docker builder prune -f

      - name: Build and start containers
        run: docker compose up -d --build
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10

      - name: Check containers status
        run: docker compose ps

      - name: Show backend logs
        run: docker compose logs backend --tail=20
        if: failure()

      - name: Show frontend logs
        run: docker compose logs frontend --tail=20
        if: failure()

      - name: Deployment successful
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Frontend is available at: http://localhost:8080"
